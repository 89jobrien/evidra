[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Joseph O'Brien"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
evidra-adapters = { path = "crates/evidra-adapters", version = "0.1.0" }
evidra-core = { path = "crates/evidra-core", version = "0.1.0" }
evidra-store = { path = "crates/evidra-store", version = "0.1.0" }

anyhow = "1"
assert_cmd = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", default-features = false, features = ["derive"] }
# TEMPORARY: `obfsck` is a path-only dependency while the engine's own release versioning is being
# sorted out. Path-only deliberately omits a version requirement so Cargo does not police a version
# we are not pinning yet. REPLACE with `obfsck = "0.2.0"` before any release: the producer's Stage 2
# depends on path-policy behaviour that differs between obfsck versions.
#
# `default-features = false` is load-bearing, not cosmetic. obfsck declares `default = ["analyzer"]`,
# and `analyzer` pulls axum, reqwest, tokio, clap, genai/simplify_baml, tower-http, sha2,
# shellexpand, serde_yaml, and tracing-subscriber. Evidra uses exactly three of obfsck's re-exported
# items (`Obfuscator`, `ObfuscationMapExport`, `ObfuscationLevel`) and none of them need the
# analyzer. Accepting the default added ~240 transitive packages — including an HTTP server and an
# LLM SDK — to a dependency that lives in the redaction path.
obfsck = { path = "../obfsck", default-features = false }
predicates = "3"
proptest = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# TODO(HIGH): enable `unwrap_used`, `expect_used`, and `panic`. AGENTS.md forbids five things in
# production code — `unwrap`, `expect`, `panic`, `todo`, `unimplemented`. Only three are enforced here.
# The other three rest on discipline alone, which is exactly why the single production `expect`
# (`evidra-engine/src/lib.rs`, in `Evidence::strictest_redaction`, on the ADR-010 redaction-inheritance
# path) survived a clean `-D warnings` clippy run.
#
# Scope the allow to test code rather than denying bare, or the test modules lose their assertions:
#   `#![cfg_attr(not(test), deny(clippy::unwrap_used, clippy::expect_used, clippy::panic))]`
# The workspace has 550+ `expect` calls, all but one inside `#[cfg(test)]`.
# See A-11 in `docs/AUDIT.md`.
#
# TODO(MEDIUM): `missing_docs` is not enabled either, though `PRD.md` claims it is and none of the four
# lib crates declare it — so nothing checks the public API against its own docs.
# missing_docs = "warn"
# Part of A-11 in `docs/AUDIT.md`.
#
# TODO(MEDIUM): `evidra-engine` is missing from `[workspace.dependencies]` above even though it is a
# workspace member. Harmless today because no crate consumes it — `evidra-cli` does not depend on it,
# which is why the derived slice is reachable only through the library API — but it will bite whoever
# wires the engine into the CLI and reaches for `evidra-engine.workspace = true`.
# See A-12 in `docs/AUDIT.md`.
