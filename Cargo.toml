[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Joseph O'Brien"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
evidra-adapters = { path = "crates/evidra-adapters", version = "0.1.0" }
evidra-core = { path = "crates/evidra-core", version = "0.1.0" }
evidra-store = { path = "crates/evidra-store", version = "0.1.0" }

anyhow = "1"
assert_cmd = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", default-features = false, features = ["derive"] }
predicates = "3"
proptest = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
